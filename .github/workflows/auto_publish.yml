name: Auto Publish Calm Relaxation Videos to YouTube (LuminaBlooms)

on:
  schedule:
    # Runs daily at 8:00 AM UTC (1:30 PM IST)
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = alternate days, true = force upload, false = skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
      duration:
        description: 'Video duration in seconds (default 3600 = 1 hour)'
        required: false
        default: '3600'
      dry_run:
        description: 'Dry run (test video/thumbnail generation without YouTube upload)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish-video:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GOOGLE_DRIVE_VIDEO_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_VIDEO_FOLDER_ID }}
      GOOGLE_DRIVE_AUDIO_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_AUDIO_FOLDER_ID }}
      GOOGLE_DRIVE_IMAGE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_IMAGE_FOLDER_ID }}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-freefont-ttf

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📅 Check YouTube upload schedule (Alternate days)
        id: yt_schedule
        run: |
          INPUT_CHOICE="${{ github.event.inputs.upload_youtube }}"
          if [ "$INPUT_CHOICE" = "true" ]; then
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to TRUE."
          elif [ "$INPUT_CHOICE" = "false" ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to FALSE."
          else
            # Alternate-day schedule based on UTC Day of the Year
            # Odd days (e.g. 283, 285...) = Upload to YouTube
            # Even days (e.g. 284, 286...) = Skip YouTube (1-day gap)
            DAY_OF_YEAR=$(date -u +%-j)
            echo "Current UTC Day of Year: $DAY_OF_YEAR"
            if [ $(( 10#$DAY_OF_YEAR % 2 )) -ne 0 ]; then
              echo "should_upload=true" >> "$GITHUB_OUTPUT"
              echo "✅ Today is a scheduled YouTube upload day (Day $DAY_OF_YEAR)."
            else
              echo "should_upload=false" >> "$GITHUB_OUTPUT"
              echo "⏸️ Today is an alternate off-day for YouTube (Day $DAY_OF_YEAR). Skipping YouTube upload (Facebook will still upload)."
            fi
          fi

      - name: Run automation pipeline
        env:
          UPLOAD_YOUTUBE: ${{ steps.yt_schedule.outputs.should_upload }}
        run: |
          echo "Starting LuminaBlooms publishing pipeline..."
          echo "Upload to YouTube today: $UPLOAD_YOUTUBE"
          DURATION="${{ github.event.inputs.duration || '3600' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          max_retries=2
          count=0
          until [ $count -ge $max_retries ]
          do
            echo ">>> Execution attempt $((count+1)) of $max_retries..."
            if python auto_pipeline.py --duration "$DURATION" $DRY_RUN_FLAG; then
              echo "Pipeline completed successfully."
              exit 0
            fi
            count=$((count+1))
            echo "Attempt $count failed. Retrying in 15 seconds..."
            sleep 15
          done
          echo "Pipeline failed after $max_retries attempts."
          exit 1

      - name: Commit published videos log
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add published_videos.json
          if git diff --staged --quiet; then
            echo "No changes to published_videos.json to commit."
          else
            git commit -m "chore: update published videos log [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
